services:
  docs:
    command: export PATH="$PWD/.agents/tools/node/bin:$PWD/.agents/tools/pnpm/bin:$PATH"; exec pnpm dev --hostname 0.0.0.0 --port "$PORT"
    health: /docs
    review: true
    agent: control
    portal:
      url: /docs
      title: Axiom Docs
      description: Documentation and search work without credentials; Ask AI is unavailable unless configured.
    portals:
      - url: /docs/apl/overview
        title: Query reference
      - url: /docs/restapi/introduction
        title: API reference
