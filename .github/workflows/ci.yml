name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e --project=desktop-chromium

  # Advisory prose linting. Never blocks a PR — it only posts a report comment
  # listing Vale's findings on the docs changed in the PR (or an all-clear).
  vale:
    name: Vale prose report
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    env:
      VALE_VERSION: 3.15.2
      MDX2VAST_VERSION: 0.3.1
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
      - name: Install Vale and mdx2vast
        run: |
          curl -sSfL "https://github.com/errata-ai/vale/releases/download/v${VALE_VERSION}/vale_${VALE_VERSION}_Linux_64-bit.tar.gz" \
            | sudo tar -xz -C /usr/local/bin vale
          vale --version
          # mdx2vast gives Vale a real MDX AST so code/JSX are excluded. Must be on $PATH.
          npm install -g "mdx2vast@${MDX2VAST_VERSION}"
          mdx2vast --version
      - name: Run Vale on changed docs
        id: vale
        run: |
          base='${{ github.event.pull_request.base.sha }}'
          head='${{ github.event.pull_request.head.sha }}'
          mapfile -t files < <(git diff --name-only --diff-filter=d "$base" "$head" -- content | grep -E '\.mdx?$' || true)
          echo "count=${#files[@]}" >> "$GITHUB_OUTPUT"
          : > vale-skipped.txt
          if [ "${#files[@]}" -eq 0 ]; then
            echo 'No changed docs; skipping Vale.'
            echo '{}' > vale.json
            exit 0
          fi
          printf '%s\n' "${files[@]}"
          # Lint each file on its own and merge the JSON. A file mdx2vast can't
          # parse (E100) is recorded and skipped rather than aborting the batch,
          # so one bad file never wipes the report. This job stays green regardless.
          merged='{}'
          for f in "${files[@]}"; do
            json="$(vale --output=JSON "$f" 2>/dev/null || true)"
            if [ -n "$json" ] && printf '%s' "$json" | jq -e 'type == "object"' >/dev/null 2>&1; then
              merged="$(jq -s '.[0] * .[1]' <(printf '%s' "$merged") <(printf '%s' "$json"))"
            else
              echo "$f" >> vale-skipped.txt
            fi
          done
          printf '%s' "$merged" > vale.json
      - name: Post report comment
        if: steps.vale.outputs.count != '0'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- vale-report -->';
            let data = {};
            try { data = JSON.parse(fs.readFileSync('vale.json', 'utf8')); } catch {}
            let skipped = [];
            try {
              skipped = fs.readFileSync('vale-skipped.txt', 'utf8').split('\n').filter(Boolean);
            } catch {}

            const sev = { error: '🔴', warning: '🟡', suggestion: '🔵' };
            const rows = [];
            for (const [file, alerts] of Object.entries(data)) {
              for (const a of alerts) {
                rows.push({ file, ...a });
              }
            }
            rows.sort((a, b) =>
              a.file.localeCompare(b.file) || a.Line - b.Line);

            let body = `${marker}\n### 📝 Vale prose report\n\n`;
            if (rows.length === 0) {
              body += '✅ No prose issues found in the docs changed by this PR.\n';
            } else {
              const counts = rows.reduce((m, r) => (m[r.Severity] = (m[r.Severity] || 0) + 1, m), {});
              const summary = ['error', 'warning', 'suggestion']
                .filter((s) => counts[s])
                .map((s) => `${sev[s]} ${counts[s]} ${s}${counts[s] > 1 ? 's' : ''}`)
                .join(' · ');
              body += `${summary}\n\n`;
              body += '| | Location | Rule | Message |\n|---|---|---|---|\n';
              for (const r of rows) {
                const loc = `\`${r.file}:${r.Line}\``;
                const msg = String(r.Message).replace(/\|/g, '\\|');
                body += `| ${sev[r.Severity] || ''} | ${loc} | \`${r.Check}\` | ${msg} |\n`;
              }
              body += '\n_Advisory only — this check never blocks the PR. Fixes are optional._\n';
            }

            if (skipped.length) {
              body += `\n> ⚠️ ${skipped.length} file(s) couldn't be parsed as MDX and were skipped:\n`;
              body += skipped.map((f) => `> - \`${f}\``).join('\n') + '\n';
            }

            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const { data: comments } = await github.rest.issues.listComments({ owner, repo, issue_number });
            const existing = comments.find((c) => c.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
