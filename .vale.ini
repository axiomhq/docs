StylesPath = ".vale/styles"

MinAlertLevel = suggestion

Vocab = docs

Packages = Google

IgnoredScopes = code, tt, img, url, a, link, blockquote

SkippedScopes = script, style, pre, figure, code

# Treat MDX as Markdown
[formats]
mdx = md

[*.{md,mdx}]

BasedOnStyles = Google, docs
CommentDelimiters = {/*, */}

# For now, ignore rules because they give too many false positives
Google.Passive = NO
Google.Acronyms = NO
Google.Headings = NO
Google.Parens = NO
Google.Colons = NO
Google.Ordinal = NO
Google.Will = NO
Google.EmDash = NO
Google.Semicolons = NO

# Vale maps MDX to Markdown, so its parser can't reliably scope embedded code
# (TS/JS/HCL snippets, JSX). These rules match code *syntax* far more than prose
# — the `!` non-null assertion, `...` spread, `object.Property` access, and
# quoted string literals — so on this corpus they are almost pure false positives.
Google.Spacing = NO
Google.Quotes = NO
Google.Exclamation = NO
Google.Ellipses = NO

# Ignore code surrounded by backticks or plus sign, parameters defaults, URLs, and angle brackets.
TokenIgnores = (<\/?[A-Z].+>), (\x60[^\n\x60]+\x60), ([^\n]+=[^\n]*), (\+[^\n]+\+), (http[^\n]+\[)
# The fenced-code pattern allows leading indentation on both fences (` *`) so code
# blocks nested in list items (indented 2-4 spaces) are ignored too — without it,
# the closing fence is missed, fence pairing desyncs, and code gets linted as prose.
# The `export const … }` pattern skips MDX ESM blocks (e.g. snippet definitions).
BlockIgnores = ( *```[a-z]*[\s\S]*?\n *```), (export const [\s\S]*?\n}), (---[\s\S]*?\n---), (keywords: [\s\S]*?\n), (sidebarTitle: [\s\S]*?\n)